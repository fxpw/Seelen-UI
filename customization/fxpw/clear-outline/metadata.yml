id: "@fxpw/clear-outline"
metadata:
  displayName:
    en: "fxpw Clear Outline"
  description:
    en: "Transparent taskbar, toolbar and application menu with outlined text and icons."
  tags:
    - toolbar
    - weg
    - transparent
styles:
  "@seelen/fancy-toolbar": !include styles/toolbar.css
  "@seelen/weg": !include styles/dock.css
  "@seelen/apps-menu": !include styles/start.css
sharedStyles: !include styles/tokens.css
settings:
  - syntax: <color>
    name: --fxpw-foreground
    label:
      en: "Text and symbol color"
    initialValue: "#ffffff"
  - syntax: <color>
    name: --fxpw-outline
    label:
      en: "Outline color"
    initialValue: "#000000"
  - syntax: <number>
    name: --fxpw-outline-width
    label:
      en: "Outline width"
    initialValue: 1
    min: 0
    max: 2
    step: 0.25
